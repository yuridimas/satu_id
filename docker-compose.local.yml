# SatuID — LOCAL override: development dengan live-reload + Vite HMR.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
#
# Beda dari base: source di-bind-mount (edit langsung terlihat), vendor dan
# bootstrap-cache jadi volume (agar tidak tertimpa host), DB di-publish ke
# host, dan ada service `vite` (pnpm run dev + HMR di :5173). File `public/hot`
# mengalir lewat bind-mount ./public sehingga @vite otomatis pakai dev server.

services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      APP_URL: http://localhost:8080
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  web:
    depends_on:
      - app
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    ports:
      - "5432:5432"

  queue:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      APP_URL: http://localhost:8080
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  scheduler:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      APP_URL: http://localhost:8080
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  vite:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/pnpm-store
    environment:
      PNPM_HOME: /pnpm-store
      PATH: /pnpm-store:/usr/local/bin:/usr/bin:/bin
    command: sh -c "corepack enable pnpm && pnpm install && pnpm run dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  vendor:
  pnpm-store:
