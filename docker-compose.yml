# SatuID — BASE compose (production-safe defaults).
#
# File ini TIDAK untuk dijalankan langsung apa adanya untuk dev: tidak ada
# bind-mount source dan DB tidak di-publish. Pilih salah satu override:
#   local ..... : docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
#   staging ... : ENV_FILE=.env.staging docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build -d
#   production  : ENV_FILE=.env.production docker compose -f docker-compose.yml -f docker-compose.production.yml up --build -d
#
# Service yang SENGAJA TIDAK ADA (hasil scan kode, berlaku semua env):
#  - Tanpa redis ......... CACHE_STORE, QUEUE_CONNECTION, SESSION_DRIVER = database.
#  - Tanpa service UM ..... tidak ada dependensi service eksternal di kode.
#
# PERINGATAN VOLUME (baca sebelum `docker compose down -v`):
#  - `pgdata` menyimpan SELURUH database Postgres.
#  - `app-storage` menyimpan storage/ Laravel, termasuk Passport encryption
#    keys (storage/oauth-private.key & oauth-public.key). Kalau volume ini
#    dihapus, key BARU akan di-generate saat boot berikutnya dan SEMUA token
#    OAuth yang sudah terbit ke user langsung INVALID.

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    volumes:
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      # File statis (index.php, hasil build) dari image. Di local,
      # mount ini diganti bind-mount ./public via override.
      - app-public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: satu_id_4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d satu_id_4"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    volumes:
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    volumes:
      - app-storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    # schedule:work = loop foreground sendiri (bukan schedule:run via cron).
    # Menjalankan exports:prune harian + scheduler lain di routes/console.php.
    command: ["php", "artisan", "schedule:work"]

volumes:
  pgdata:
  app-public:
  app-storage:
  bootstrap-cache:
