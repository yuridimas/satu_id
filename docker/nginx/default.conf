# Nginx reverse proxy ke PHP-FPM (service `app`), serve file statis langsung.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Laravel routing: file statis dulu, sisanya ke index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset build berversi (public/build) boleh di-cache agresif.
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Resolver Docker (127.0.0.11) + variable agar nginx resolve ulang
        # hostname `app` tiap request — tanpa ini, recreate container app
        # (IP baru) membuat nginx tetap menembak IP lama → 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fpm app:9000;
        fastcgi_pass $fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Blokir file sensitif yang tidak boleh terekspos via web.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
